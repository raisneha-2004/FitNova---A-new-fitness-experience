<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff5a36" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0d17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0d17" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#0b0d17" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0b0d17" />
  <rect width="1920" height="1080" fill="url(#bg-glow)" />

  <!-- Clean abstract gradient overlay only (zero drawn athletes/figures) -->
